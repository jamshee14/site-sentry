<!DOCTYPE html>
<html>
<head>
    <title>Network Monitor</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Site Sentry Dashboard</h1>
    <div style="background: #eee; padding: 20px; margin-bottom: 20px; border-radius: 8px;">
        <form action="/" method="GET">
            <label for="url"><strong>Website to Check:</strong></label>
            <input type="text" id="url" name="url" placeholder="https://www.logichive.in" style="width: 300px; padding: 5px;">
            <button type="submit" style="background: #4CAF50; color: white; padding: 6px 12px; border: none; cursor: pointer;">
                Run Check
            </button>
        </form>
    </div>
    <table>
        <thead>
            <tr>
                <th>Time</th>
                <th>Website</th>
                <th>Status</th>
                <th>Latency</th>
            </tr>
        </thead>
        <tbody>
            {% for row in logs %}
            <tr>
                <td>{{ row.time }}</td>
                <td>{{ row.site }}</td>
                <td style="color: {{ 'red' if row.status == 'OFFLINE' else 'green' }}>
                    {{ row.status }}
                </td>
                <td>{{ row.latency }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
